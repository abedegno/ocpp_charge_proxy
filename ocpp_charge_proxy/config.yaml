name: "OCPP Charge Proxy"
description: "OCPP 1.6 emulator and transparent charger relay"
version: "0.2.0"
slug: "ocpp_charge_proxy"
url: "https://github.com/abedegno/ocpp_charge_proxy"
arch:
  - aarch64
  - amd64
init: false
startup: "services"
homeassistant_api: true
ingress: true
panel_icon: "mdi:ev-station"
panel_title: "OCPP Charge Proxy"
map:
  - ssl:ro
ports:
  "9000/tcp": null
  "8099/tcp": null
ports_description:
  "9000/tcp": "Authenticated OCPP relay (map only in relay mode)"
  "8099/tcp": "Companion integration API"
discovery:
  - ocpp_charge_proxy
image: "ghcr.io/abedegno/{arch}-addon-ocpp-charge-proxy"
options:
  mode: "emulator"
  relay_certfile: ""
  relay_keyfile: ""
  server_hostname: ""
  chargepoint_id: ""
  password: ""
  charger_model: "PLP2-0-2-2"
  charger_vendor: "Wall Box Chargers"
  charger_serial: ""
  firmware_version: "6.11.16"
  current_amps: 32
  initial_energy_wh: 0
  log_level: "info"
schema:
  mode: list(emulator|relay)
  relay_certfile: str?
  relay_keyfile: str?
  server_hostname: str
  chargepoint_id: str
  password: password
  charger_model: str
  charger_vendor: str
  charger_serial: str?
  firmware_version: str
  current_amps: "int(6,32)"
  initial_energy_wh: "int(0,)?"
  log_level: list(debug|info|warning|error)
