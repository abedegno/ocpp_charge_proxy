name: Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: App Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r ocpp_charge_proxy/requirements-dev.txt
      - name: Test app and measure branch coverage
        run: >-
          python -m pytest ocpp_charge_proxy/tests -q
          --cov=src --cov-branch --cov-report=term-missing
          --cov-report=xml:coverage-app.xml --cov-fail-under=70
      - name: Save coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-app-${{ matrix.python }}
          path: coverage-app.xml

  companion:
    name: Companion Home Assistant 2026.11.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-ha-test.txt
      - name: Test actual Home Assistant classes
        run: >-
          python -m pytest tests -q
          --cov=custom_components.ocpp_charge_proxy --cov-branch
          --cov-report=term-missing --cov-report=xml:coverage-companion.xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-companion
          path: coverage-companion.xml
