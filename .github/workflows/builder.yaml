name: Builder

env:
  BUILD_ARGS: "--test"
  MONITORED_FILES: "build.yaml config.yaml Dockerfile rootfs src requirements.txt"

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  verify:
    uses: ./.github/workflows/test.yaml

  init:
    runs-on: ubuntu-latest
    name: Initialize builds
    outputs:
      changed_addons: ${{ steps.changed_addons.outputs.addons }}
      changed: ${{ steps.changed_addons.outputs.changed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed_files
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_REF" ]] && git cat-file -e "${BASE_REF}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BASE_REF" "$GITHUB_SHA")
          else
            changed=$(git ls-tree -r --name-only HEAD)
          fi
          {
            echo "all<<EOF"
            echo "$changed"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Find add-on directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@master

      - name: Get changed add-ons
        id: changed_addons
        env:
          CHANGED_FILES: ${{ steps.changed_files.outputs.all }}
          ADDON_PATHS: ${{ steps.addons.outputs.addons }}
        run: |
          python3 - <<'PY'
          import json
          import os
          changed = os.environ["CHANGED_FILES"].splitlines()
          selected = []
          for addon in os.environ["ADDON_PATHS"].split():
              for name in os.environ["MONITORED_FILES"].split():
                  target = f"{addon}/{name}"
                  if any(path == target or path.startswith(target + "/") for path in changed):
                      selected.append(addon)
                      break
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("changed=" + str(bool(selected)).lower() + "\n")
              output.write("addons=" + json.dumps(selected) + "\n")
          PY

  build:
    needs: [init, verify]
    runs-on: ubuntu-latest
    if: needs.init.outputs.changed == 'true'
    name: Build ${{ matrix.arch }} ${{ matrix.addon }} add-on
    strategy:
      matrix:
        addon: ${{ fromJson(needs.init.outputs.changed_addons) }}
        arch: ["aarch64", "amd64"]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Get information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ matrix.addon }}"

      - name: Check if add-on should be built
        id: check
        env:
          INFO_IMAGE: ${{ steps.info.outputs.image }}
          INFO_ARCHITECTURES: ${{ steps.info.outputs.architectures }}
          TARGET_ARCH: ${{ matrix.arch }}
          HEAD_REF: ${{ github.head_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          def decode(value):
              try:
                  return json.loads(value)
              except json.JSONDecodeError:
                  return value
          image = decode(os.environ["INFO_IMAGE"])
          architectures = decode(os.environ["INFO_ARCHITECTURES"])
          if isinstance(architectures, str):
              architectures = architectures.split()
          name = image.rsplit("/", 1)[-1] if isinstance(image, str) else ""
          valid = bool(name and name != "null" and re.fullmatch(r"[a-z0-9_.{}-]+", name)
              and isinstance(architectures, list) and os.environ["TARGET_ARCH"] in architectures)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("build_arch=" + str(valid).lower() + "\n")
              if valid:
                  output.write("image=" + name + "\n")
          if valid and not os.environ["HEAD_REF"] and os.environ["EVENT_NAME"] == "push":
              with open(os.environ["GITHUB_ENV"], "a") as output:
                  output.write("BUILD_ARGS=\n")
          PY

      - name: Login to GitHub Container Registry
        if: env.BUILD_ARGS != '--test'
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.addon }} add-on
        if: steps.check.outputs.build_arch == 'true'
        uses: home-assistant/builder@2026.02.1
        with:
          args: |
            ${{ env.BUILD_ARGS }} \
            --${{ matrix.arch }} \
            --target /data/${{ matrix.addon }} \
            --image "${{ steps.check.outputs.image }}" \
            --docker-hub "ghcr.io/${{ github.repository_owner }}" \
            --addon
